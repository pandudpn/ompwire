[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ompwire"
version = "0.3.0"
description = "Transport-only chat bridge for OMP agents over the Agent Client Protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# `serve` is the whole point of the tool, so the transport dependencies are not optional
dependencies = [
  "python-telegram-bot>=21.0",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ompwire = "ompwire.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ompwire"]
