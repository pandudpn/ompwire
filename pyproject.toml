[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ompwire"
version = "0.1.0"
description = "Transport-only chat bridge for OMP agents over the Agent Client Protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21.0"]
hub = ["PyYAML>=6"]
dev = ["pytest>=8"]

[project.scripts]
ompwire = "ompwire.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ompwire"]
