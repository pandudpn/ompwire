[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ompwire"
version = "0.1.0"
description = "Chat harness that drives an OMP agent over the Agent Client Protocol"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21.0"]
dev = ["pytest>=8"]

[project.scripts]
ompwire = "ompwire.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ompwire"]
