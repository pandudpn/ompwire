[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ompwire"
version = "0.17.2"
description = "Chat bridge that runs an OMP coding agent from Telegram and WhatsApp"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# `serve` is the whole point of the tool, so the transport dependencies are not optional
dependencies = [
  "python-telegram-bot>=21.0",
  "PyYAML>=6",
  # WhatsApp: whatsmeow through a prebuilt binding; segno draws the link QR
  "neonize>=0.5.2",
  "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17"]

[project.scripts]
ompwire = "ompwire.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ompwire"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberate subset: bugs, imports, modernisation, simplification. Anything that only
# argues about style is left out, so a red CI means something.
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# "·" is used on purpose in the chat cards and the CLI labels.
# SIM105/SIM108/RUF005 only reshuffle shapes that are already readable; they would add
# churn without changing behaviour. Everything still enabled is a bug or a real smell.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM105", "SIM108", "RUF005"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
