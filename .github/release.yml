# Categories for GitHub's own release notes, used by `--generate-notes` when a release is built
# from merged pull requests. The workflow does not rely on this: ompwire commits straight to main,
# and scripts/release/notes.py builds the body from the log and groups it by conventional type.
# Keep the two in step so the body reads the same whichever path produced it.
changelog:
  exclude:
    labels: [skip-changelog, dependencies]
    authors: ["github-actions[bot]"]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug, fix]
    - title: Documentation
      labels: [documentation, docs]
    - title: Build and CI
      labels: [ci, build, dependencies]
    - title: Other changes
      labels: ["*"]
